[package]
name = "dsh-verifier-core"
version = "0.1.0"
edition = "2021"
description = "Deterministic verification mathematics for the DSH-llm-as-a-verifier preset"
authors = ["Beijing Taiyin Zhaowu Technology Co., Ltd. <tystudio-26020701@protonmail.com>"]
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = { version = "1", default-features = false, features = ["alloc"] }
libm = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
linked_list_allocator = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
